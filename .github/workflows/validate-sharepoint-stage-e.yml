name: Validate SharePoint Stage E
on:
  push:
    branches:
      - validation/sharepoint-stage-e-ci
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Geography checks
        run: npm run check:geo
      - name: Engine checks
        run: npm run check:engine
      - name: Repository checks
        run: npm run check:repository
