name: Stage E CI
on:
  push:
    branches: [validation-stage-e-2]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run check:geo
      - run: npm run check:engine
      - run: npm run check:repository
